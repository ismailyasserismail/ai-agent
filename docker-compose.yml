version: '3.9'
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chatbot
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql
      - ./backend/db/seed.sql:/docker-entrypoint-initdb.d/002-seed.sql
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    depends_on:
      - postgres
    environment:
      PORT: 4000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/chatbot
      JWT_SECRET: change-me
      CORS_ORIGIN: http://localhost:5173
      ENABLE_WHATSAPP: ${ENABLE_WHATSAPP:-false}
      ENABLE_INSTAGRAM: ${ENABLE_INSTAGRAM:-false}
    ports:
      - "4000:4000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=http://localhost:4000/api
    ports:
      - "5173:80"

volumes:
  pgdata:
